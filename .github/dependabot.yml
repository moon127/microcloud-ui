# Weekly dependency updates, one grouped pull request per ecosystem (D76), minor and patch
# versions only: a major upgrade (React Router, TypeScript, Vite...) is planned work, not a
# weekly merge. Security fixes still come, majors included, from Dependabot security updates
# (enabled in the repository settings), and every advisory shows on the Security tab.
# The Containerfile's base images aren't listed: their CVEs are caught by the weekly image
# scan (security.yml), and tag bumps (node 22 → 24) are a deliberate choice.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
