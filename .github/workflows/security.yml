name: Security
# Weekly, or by hand (D76): known vulnerabilities in the dependencies, and fixable ones in
# the published image. Fixable image CVEs open (or update) one "Rebuild needed" issue,
# closed again when a scan comes back clean; the fix is a patch release. The folder
# browser helpers' Alpine image is checked the same way (D97), with its own issue.
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:  # fails the run (and GitHub emails) if anything high or critical turns up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install audit
      - name: Build tools too (they don't ship, so CI doesn't block on them)
        run: cd frontend && npm audit --audit-level=high
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      security-events: write
    env:
      IMAGE: ghcr.io/moon127/microcloud-ui:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pinned to a commit, not a tag: trivy-action's tags were rewritten in March 2026
      # (the 0.x tags became v0.x); Dependabot keeps the pin current
      - name: Scan the latest release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: json
          output: trivy.json
      - name: The same, for the Security tab
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy.sarif
          category: image
      - name: Open, update or close the "Rebuild needed" issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(python3 scripts/image_cves.py trivy.json "$IMAGE")
          gh label create rebuild-needed --color d93f0b \
            --description "Fixable vulnerabilities in the published image" 2>/dev/null || true
          open=$(gh issue list --label rebuild-needed --state open --json number -q '.[0].number')
          if [ -n "$body" ] && [ -n "$open" ]; then
            gh issue edit "$open" --body "$body"
          elif [ -n "$body" ]; then
            gh issue create --title "Rebuild needed: fixable vulnerabilities in the image" \
              --label rebuild-needed --body "$body"
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "The latest scan found no fixable HIGH or CRITICAL vulnerabilities."
          fi
  helper-image:  # the folder browser helpers' Alpine image, as LXD pulls it today (D97)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # unpacking downloaded data: no token in .git/config
      - name: Fetch the image (checked against the image server's sha256)
        run: |
          python3 scripts/helper_image.py fetch helper
          command -v unsquashfs >/dev/null || {
            sudo apt-get -qq update && sudo apt-get -qq install -y squashfs-tools >/dev/null; }
          # as the runner's user, not root: device nodes and ownership don't matter to Trivy
          unsquashfs -q -no-xattrs -ignore-errors -d helper/rootfs helper/rootfs.squashfs || true
          test -e helper/rootfs/etc/alpine-release
      - name: Scan it
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: helper/rootfs
          ignore-unfixed: true
          list-all-pkgs: true  # so the report can show it really read the apk database
          severity: HIGH,CRITICAL
          format: json
          output: helper-trivy.json
      - name: Open, update or close the "Folder browser helper image" issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(python3 scripts/helper_image.py report helper-trivy.json helper/image.json)
          gh label create helper-image --color fbca04 \
            --description "The folder browser helpers' image needs attention" 2>/dev/null || true
          open=$(gh issue list --label helper-image --state open --json number -q '.[0].number')
          if [ -n "$body" ] && [ -n "$open" ]; then
            gh issue edit "$open" --body "$body"
          elif [ -n "$body" ]; then
            gh issue create --title "Folder browser helper image needs attention" \
              --label helper-image --body "$body"
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "The latest check found nothing to do."
          fi
