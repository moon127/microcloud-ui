# Builds and publishes the image and the offline bundles (D67, D68). Three modes:
#   release  a tag vX.Y.Z matching mcui.__version__: CI, then ghcr.io/<owner>/<repo>
#            :X.Y.Z, :X.Y and :latest and a GitHub Release with the bundles
#   edge     every push to main once CI has passed on it: :edge and :edge-<sha>, and the
#            rolling pre-release "edge" with that commit's bundles (version X.Y.Z.devN)
#   dry-run  run by hand (Actions > Release > Run workflow): CI and every build, nothing
#            pushed or released
# Images build natively for linux/amd64 and linux/arm64, each pushed by digest; the
# merge job tags both as one. Steps: docs/RELEASING.md.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# a newer push to main replaces an edge build still in progress
concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'edge' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  setup:
    # edge only for CI runs that passed on a push to this repository's main (never a fork)
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.v.outputs.mode }}
      ref: ${{ steps.v.outputs.ref }}
      version: ${{ steps.v.outputs.version }}
      tags: ${{ steps.v.outputs.tags }}
      previous: ${{ steps.v.outputs.previous }}
      since: ${{ steps.v.outputs.since }}
      changes: ${{ steps.v.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.event.workflow_run.head_sha || github.sha }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          case "$EVENT" in
            push)
              mode=release
              version=$(python scripts/build_version.py release "$GITHUB_REF_NAME")
              tags="$IMAGE:$version $IMAGE:${version%.*} $IMAGE:latest" ;;
            workflow_run)
              mode=edge
              version=$(python scripts/build_version.py dev)
              tags="$IMAGE:edge $IMAGE:edge-${REF::7}" ;;
            *)
              mode=dry-run
              version=$(python scripts/build_version.py dev)
              tags="" ;;
          esac
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$REF^" 2>/dev/null || true)
          # a release lists what's new since the one before; edge, since the latest release
          if [ "$mode" = release ]; then since=$previous
          else since=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$REF" 2>/dev/null || true); fi
          changes=$(python scripts/build_version.py changes ${since:+"$since"})
          delim="CHANGES_$RANDOM$RANDOM"
          {
            echo "mode=$mode"; echo "ref=$REF"; echo "version=$version"
            echo "tags=$tags"; echo "previous=$previous"; echo "since=$since"
            echo "changes<<$delim"; echo "$changes"; echo "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "**$mode** build of \`${REF::7}\`: mcui $version" >> "$GITHUB_STEP_SUMMARY"

  # edge builds come after CI has already passed on the commit
  ci:
    needs: setup
    if: needs.setup.outputs.mode != 'edge'
    uses: ./.github/workflows/ci.yml

  image:
    needs: [setup, ci]
    if: >-
      !cancelled() && needs.setup.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.ci.result)
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ needs.setup.outputs.mode != 'dry-run' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - name: Stamp the version
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" backend/mcui/__init__.py
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/container/Containerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.setup.outputs.ref }}
            org.opencontainers.image.version=${{ needs.setup.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha,scope=${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }}
      - if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  merge:
    needs: [setup, image]
    if: >-
      !cancelled() && needs.image.result == 'success' && needs.setup.outputs.mode != 'dry-run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both platform images as one
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ needs.setup.outputs.tags }}
          VERSION: ${{ needs.setup.outputs.version }}
          REF: ${{ needs.setup.outputs.ref }}
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "$tag"); done
          # shellcheck disable=SC2046  # one argument per digest
          docker buildx imagetools create "${args[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.description=Web UI and metrics for Canonical MicroCloud" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$REF" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "${TAGS%% *}"

  bundle:
    needs: [setup, ci]
    if: >-
      !cancelled() && needs.setup.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.ci.result)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - name: Stamp the version
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" backend/mcui/__init__.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      # Ubuntu 26.04 (Python 3.14), 24.04 (3.12) and 22.04 (3.10), x86_64 and aarch64
      - run: |
          for pyver in 3.14 3.12 3.10; do
            for arch in x86_64 aarch64; do make bundle PYVER=$pyver ARCH=$arch; done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: dist/*.tar.gz

  release:
    needs: [setup, merge, bundle]
    if: >-
      !cancelled() && needs.merge.result == 'success' && needs.bundle.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ghcr.io/${{ github.repository }}
      MODE: ${{ needs.setup.outputs.mode }}
      REF: ${{ needs.setup.outputs.ref }}
      VERSION: ${{ needs.setup.outputs.version }}
      PREVIOUS: ${{ needs.setup.outputs.previous }}
      SINCE: ${{ needs.setup.outputs.since }}
      CHANGES: ${{ needs.setup.outputs.changes }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: dist
      - name: GitHub Release for the tag
        if: env.MODE == 'release'
        run: |
          start=()
          if [ -n "$PREVIOUS" ]; then start=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "microcloud-ui $VERSION" --generate-notes "${start[@]}" \
            --notes "Container image: \`podman pull $IMAGE:$VERSION\` (amd64, arm64).
          Offline bundles for Ubuntu 26.04 (py3.14), 24.04 (py3.12) and 22.04 (py3.10) are attached; see docs/DEPLOY.md.

          ## Changes${SINCE:+ since $SINCE}

          $CHANGES"
      - name: Rolling pre-release "edge"
        if: env.MODE == 'edge'
        run: |
          # move the tag edge to this commit (created on the first edge build)
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/edge" -f sha="$REF" -F force=true >/dev/null \
            || gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/edge -f sha="$REF" >/dev/null
          notes="Development build of \`main\` at ${REF::7} (mcui $VERSION), rebuilt after every push
          that passes CI. Not a release: for trying what's next. Image:
          \`podman pull $IMAGE:edge\` (or \`:edge-${REF::7}\` for this build), amd64 and arm64.

          ## Changes${SINCE:+ since $SINCE}

          $CHANGES"
          if gh release view edge >/dev/null 2>&1; then
            old=$(gh release view edge --json assets --jq '.assets[].name')
            gh release edit edge --prerelease --latest=false --title "Development build (edge)" --notes "$notes"
            gh release upload edge dist/*.tar.gz --clobber
            for asset in $old; do
              [ -e "dist/$asset" ] || gh release delete-asset edge "$asset" --yes
            done
          else
            gh release create edge dist/*.tar.gz --prerelease --latest=false \
              --title "Development build (edge)" --notes "$notes"
          fi
