# Release (D67): pushing a tag vX.Y.Z that matches mcui.__version__ runs CI, then
#   - pushes ghcr.io/<owner>/<repo>:X.Y.Z, :X.Y and :latest (linux/amd64 + linux/arm64,
#     each built on a native GitHub runner)
#   - creates the GitHub Release with the offline bundles attached
# Run by hand (Actions > Release > Run workflow) for a dry run: everything is built,
# nothing is pushed or released. Steps: docs/RELEASING.md.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches mcui.__version__
        if: env.PUBLISH == 'true'
        run: python scripts/release_check.py "$GITHUB_REF_NAME"

  # each platform on its own native runner, pushed by digest; merge tags them as one
  image:
    needs: [ci, version]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/container/Containerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha,scope=${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }}
      - if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  merge:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both platform images as X.Y.Z, X.Y and latest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # shellcheck disable=SC2046  # one argument per tag and per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.description=Web UI and metrics for Canonical MicroCloud" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  bundle:
    needs: [ci, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      # Ubuntu 24.04 (Python 3.12) and 22.04 (3.10), x86_64 and aarch64
      - run: |
          for pyver in 3.12 3.10; do
            for arch in x86_64 aarch64; do make bundle PYVER=$pyver ARCH=$arch; done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [merge, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" \
            --title "microcloud-ui $version" --generate-notes \
            --notes "Container image: \`podman pull ${IMAGE,,}:$version\` (amd64, arm64).
          Offline bundles for Ubuntu 24.04 (py3.12) and 22.04 (py3.10) are attached; see docs/DEPLOY.md."
