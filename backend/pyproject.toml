[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcui"
description = "Web UI and metrics for Canonical MicroCloud (LXD, MicroCeph, MicroOVN)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gareth Woolridge", email = "gareth@woolridge.org.uk" }]
requires-python = ">=3.12"  # Ubuntu 24.04 and 26.04 (D77)
dynamic = ["version"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic-settings>=2.2",
  "argon2-cffi>=23.1",
  "websockets>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "shellcheck-py>=0.10",  # lints deploy/ and scripts/ (make lint)
  "pip-audit>=2.7",  # known vulnerabilities in the runtime dependencies (make audit, D76)
]

[project.scripts]
mcui = "mcui.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mcui.__version__" }

[tool.setuptools.packages.find]
include = ["mcui*"]

[tool.setuptools.package-data]
# the built SPA, copied in by `make dist` (absent in a checkout)
mcui = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["mcui"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "ASYNC"]
# ASYNC109 (py311+) suggests asyncio.timeout over a `timeout` parameter; ours are httpx
# request timeouts and how long LXD holds an operation wait, not asyncio deadlines
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mcui"]
