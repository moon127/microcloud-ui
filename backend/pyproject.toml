[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcui"
description = "Web UI and metrics for Canonical MicroCloud (LXD, MicroCeph, MicroOVN)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gareth Woolridge", email = "gareth@woolridge.org.uk" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic-settings>=2.2",
  "argon2-cffi>=23.1",
  "websockets>=13",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
mcui = "mcui.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mcui.__version__" }

[tool.setuptools.packages.find]
include = ["mcui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["mcui"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["mcui"]
